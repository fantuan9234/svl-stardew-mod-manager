<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVL Banner Generator</title>
<style>
body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
#canvas-container { box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div id="canvas-container"></div>
<script>
const W = 1300, H = 372;
const canvas = document.createElement('canvas');
canvas.width = W;
canvas.height = H;
document.getElementById('canvas-container').appendChild(canvas);
const ctx = canvas.getContext('2d');

// Background gradient - dark with golden accents
const bgGrad = ctx.createLinearGradient(0, 0, W, H);
bgGrad.addColorStop(0, '#0f0f1a');
bgGrad.addColorStop(0.4, '#1a1a2e');
bgGrad.addColorStop(0.7, '#16213e');
bgGrad.addColorStop(1, '#0f3460');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);

// Subtle grid pattern
ctx.strokeStyle = 'rgba(212, 168, 67, 0.03)';
ctx.lineWidth = 1;
for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
}
for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
}

// Floating particles/stars
for (let i = 0; i < 60; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const size = Math.random() * 2 + 0.5;
    const alpha = Math.random() * 0.4 + 0.1;
    ctx.fillStyle = `rgba(212, 168, 67, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
}

// Left side glow
const leftGlow = ctx.createRadialGradient(200, H/2, 0, 200, H/2, 400);
leftGlow.addColorStop(0, 'rgba(212, 168, 67, 0.08)');
leftGlow.addColorStop(1, 'rgba(212, 168, 67, 0)');
ctx.fillStyle = leftGlow;
ctx.fillRect(0, 0, W, H);

// Right side decorative elements - pixel art style farm elements
function drawPixelWheat(x, y, scale) {
    ctx.fillStyle = '#d4a843';
    const pixels = [
        [0,4],[0,5],[0,6],[0,7],
        [-1,3],[-1,4],[-1,5],[-1,6],
        [1,3],[1,4],[1,5],[1,6],
        [-2,2],[-2,3],[-2,4],
        [2,2],[2,3],[2,4],
    ];
    pixels.forEach(([px, py]) => {
        ctx.fillRect(x + px * scale, y + py * scale, scale, scale);
    });
}

// Draw wheat stalks on right side
for (let i = 0; i < 8; i++) {
    const wx = W - 150 + i * 25 + Math.sin(i * 1.5) * 10;
    const wy = H - 40;
    drawPixelWheat(wx, wy, 3 + Math.random() * 2);
}

// Decorative circles on right
ctx.strokeStyle = 'rgba(212, 168, 67, 0.1)';
ctx.lineWidth = 2;
for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(W - 200 + i * 50, H/2 - 50 + i * 30, 60 + i * 20, 0, Math.PI * 2);
    ctx.stroke();
}

// Main text area - LEFT SIDE
const textX = 80;
const textY = H / 2;

// SVL Logo text
ctx.font = 'bold 80px "Segoe UI", "Helvetica Neue", Arial, sans-serif';
ctx.fillStyle = '#d4a843';
ctx.textAlign = 'left';
ctx.textBaseline = 'middle';
ctx.fillText('SVL', textX, textY - 30);

// Subtitle
ctx.font = '300 24px "Segoe UI", "Helvetica Neue", Arial, sans-serif';
ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
ctx.fillText('Stardew Valley Mod Manager', textX, textY + 25);

// Tagline
ctx.font = '400 16px "Segoe UI", "Helvetica Neue", Arial, sans-serif';
ctx.fillStyle = 'rgba(212, 168, 67, 0.6)';
ctx.fillText('轻量 · 智能 · 高效', textX, textY + 60);

// Golden accent line under title
ctx.strokeStyle = '#d4a843';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(textX, textY + 5);
ctx.lineTo(textX + 280, textY + 5);
ctx.stroke();

// Feature pills on left bottom
const features = ['一键安装', '冲突检测', '配置方案', '存档管理'];
let pillX = textX;
const pillY = H - 70;
features.forEach((feat, i) => {
    const width = ctx.measureText(feat).width + 24;
    
    // Pill background
    ctx.fillStyle = 'rgba(212, 168, 67, 0.12)';
    ctx.strokeStyle = 'rgba(212, 168, 67, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(pillX, pillY, width, 32, 16);
    ctx.fill();
    ctx.stroke();
    
    // Pill text
    ctx.font = '500 13px "Segoe UI", "Helvetica Neue", Arial, sans-serif';
    ctx.fillStyle = 'rgba(212, 168, 67, 0.9)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(feat, pillX + width/2, pillY + 16);
    
    pillX += width + 12;
});

// Right side - abstract UI mockup
const uiX = W - 420;
const uiY = 50;
const uiW = 340;
const uiH = 272;

// UI window background
ctx.fillStyle = 'rgba(20, 20, 35, 0.8)';
ctx.strokeStyle = 'rgba(212, 168, 67, 0.2)';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.roundRect(uiX, uiY, uiW, uiH, 12);
ctx.fill();
ctx.stroke();

// Window title bar
ctx.fillStyle = 'rgba(212, 168, 67, 0.1)';
ctx.beginPath();
ctx.roundRect(uiX, uiY, uiW, 32, [12, 12, 0, 0]);
ctx.fill();

// Window controls
ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
ctx.beginPath(); ctx.arc(uiX + 20, uiY + 16, 5, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(uiX + 36, uiY + 16, 5, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(uiX + 52, uiY + 16, 5, 0, Math.PI*2); ctx.fill();

// Sidebar
ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
ctx.fillRect(uiX, uiY + 32, 80, uiH - 32);

// Sidebar icons (abstract)
for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i === 0 ? 'rgba(212, 168, 67, 0.4)' : 'rgba(255, 255, 255, 0.15)';
    ctx.beginPath();
    ctx.roundRect(uiX + 20, uiY + 50 + i * 40, 40, 28, 6);
    ctx.fill();
}

// Content area - mod list items
const modColors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6'];
const modNames = ['SMAPI', 'Content Patcher', 'Stardew Valley Expanded', 'NPC Map Locations', 'UI Info Suite'];
for (let i = 0; i < 5; i++) {
    const rowY = uiY + 50 + i * 42;
    
    // Toggle switch
    ctx.fillStyle = i < 4 ? 'rgba(46, 204, 113, 0.6)' : 'rgba(255, 255, 255, 0.15)';
    ctx.beginPath();
    ctx.roundRect(uiX + 100, rowY + 8, 32, 16, 8);
    ctx.fill();
    
    // Mod icon
    ctx.fillStyle = modColors[i] + '40';
    ctx.beginPath();
    ctx.roundRect(uiX + 145, rowY + 2, 28, 28, 6);
    ctx.fill();
    
    // Mod name
    ctx.font = '400 12px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(modNames[i], uiX + 182, rowY + 18);
    
    // Version tag
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.roundRect(uiX + uiW - 70, rowY + 6, 50, 20, 10);
    ctx.fill();
    ctx.font = '400 10px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.textAlign = 'center';
    ctx.fillText('v3.' + (i+1), uiX + uiW - 45, rowY + 19);
}

// Bottom status bar
ctx.fillStyle = 'rgba(212, 168, 67, 0.08)';
ctx.beginPath();
ctx.roundRect(uiX, uiY + uiH - 28, uiW, 28, [0, 0, 12, 12]);
ctx.fill();
ctx.font = '400 11px "Segoe UI", sans-serif';
ctx.fillStyle = 'rgba(212, 168, 67, 0.5)';
ctx.textAlign = 'left';
ctx.fillText('✓ 5 mods loaded · 0 conflicts', uiX + 15, uiY + uiH - 10);

// Golden corner accent
ctx.strokeStyle = 'rgba(212, 168, 67, 0.3)';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(uiX + uiW - 30, uiY + uiH);
ctx.lineTo(uiX + uiW, uiY + uiH);
ctx.lineTo(uiX + uiW, uiY + uiH - 30);
ctx.stroke();

// Download button
const btnX = textX;
const btnY = H - 130;
const btnW = 160;
const btnH = 40;

// Button glow
const btnGlow = ctx.createRadialGradient(btnX + btnW/2, btnY + btnH/2, 0, btnX + btnW/2, btnY + btnH/2, 60);
btnGlow.addColorStop(0, 'rgba(212, 168, 67, 0.3)');
btnGlow.addColorStop(1, 'rgba(212, 168, 67, 0)');
ctx.fillStyle = btnGlow;
ctx.fillRect(btnX - 20, btnY - 20, btnW + 40, btnH + 40);

// Button background
ctx.fillStyle = '#d4a843';
ctx.beginPath();
ctx.roundRect(btnX, btnY, btnW, btnH, 8);
ctx.fill();

// Button text
ctx.font = '600 14px "Segoe UI", "Helvetica Neue", Arial, sans-serif';
ctx.fillStyle = '#0f0f1a';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('免费下载', btnX + btnW/2, btnY + btnH/2);

// Version text next to button
ctx.font = '400 13px "Segoe UI", sans-serif';
ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
ctx.textAlign = 'left';
ctx.fillText('v1.2.2 · Windows', btnX + btnW + 15, btnY + btnH/2);

// Output as image
canvas.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'svl-banner-1300x372.png';
    a.click();
    URL.revokeObjectURL(url);
}, 'image/png');

console.log('Banner generated! Check your downloads.');
</script>
</body>
</html>
