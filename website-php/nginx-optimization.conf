# ============================================
# Nginx SEO 优化配置
# 添加到宝塔面板：网站 → svlmod.cn → 设置 → 配置文件
# ============================================

# --- 1. HTTP 块全局配置 ---
# 在 http {} 块中添加以下内容：

# Gzip 压缩（减少传输大小，提升加载速度）
# gzip on;
# gzip_min_length 256;
# gzip_comp_level 6;
# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-httpd-php;
# gzip_vary on;
# gzip_disable "MSIE [1-6]\.";

# --- 2. Server 块配置 ---

# 2.1 www 跳转到非 www（统一域名，避免重复内容）
# server {
#     listen 80;
#     server_name www.svlmod.cn;
#     return 301 https://svlmod.cn$request_uri;
# }
# server {
